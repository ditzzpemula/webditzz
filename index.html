<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime NGL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.8)),
                        url("anime-bg.jpg");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .container {
            width: 380px;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 28px;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
            animation: up 0.8s ease;
        }

        @keyframes up {
            from { transform: translateY(60px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 16px;
            border-radius: 18px;
            border: none;
            outline: none;
            resize: none;
            background: rgba(255,255,255,0.95);
            font-size: 15.5px;
            color: #222;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(45deg, #7c3aed, #3b82f6);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.6);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.7;
        }

        .success {
            color: #22c55e;
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🌸</div>
    <h1>Anime NGL</h1>
    <p>Kirim pesan rahasia secara anonim</p>

    <textarea id="pesan" placeholder="Tulis pesanmu di sini..."></textarea>

    <button id="btnKirim">
        💌 Kirim Pesan
    </button>

    <div class="footer">
        Website by &lt;/&gt;Fahri
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnEknAOR9a7H5N2Q0Z5NvHiVYsSMOT4_Q",
        authDomain: "animengl.firebaseapp.com",
        projectId: "animengl",
        storageBucket: "animengl.firebasestorage.app",
        messagingSenderId: "110929544602",
        appId: "1:110929544602:web:9a88c2de767e0c175ee623"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btn = document.getElementById("btnKirim");
    const textarea = document.getElementById("pesan");

    window.kirim = async () => {
        const text = textarea.value.trim();

        if (text === "") {
            alert("❌ Tulis pesan dulu ya!");
            return;
        }

        // Loading state
        btn.disabled = true;
        btn.innerHTML = `⏳ Mengirim...`;

        try {
            await addDoc(collection(db, "pesan"), {
                text: text,
                time: serverTimestamp(),
                createdAt: new Date().toISOString()
            });

            textarea.value = "";
            btn.innerHTML = `✅ Terkirim!`;
            
            setTimeout(() => {
                btn.innerHTML = `💌 Kirim Pesan`;
                btn.disabled = false;
            }, 2000);

        } catch (error) {
            console.error(error);
            alert("❌ Gagal mengirim pesan.\nCoba cek koneksi internet kamu.");
            btn.innerHTML = `💌 Kirim Pesan`;
            btn.disabled = false;
        }
    };

    // Tombol kirim dengan Enter + Shift
    textarea.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            kirim();
        }
    });
</script>

</body>
</html>
