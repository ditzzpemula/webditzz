<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAHRI NGL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
font-family:'Inter',sans-serif;

}



/* BACKGROUND VIDEO */

.video-bg{

position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;

}


.overlay{

position:fixed;
inset:0;

background:
linear-gradient(
135deg,
rgba(0,50,150,.85),
rgba(255,255,255,.35)
);

z-index:-1;

}



.title{

font-family:'Space Grotesk',sans-serif;

}



.card{

backdrop-filter:blur(15px);
animation:show .8s ease;

}



@keyframes show{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}



.glow{

box-shadow:

0 0 20px #38bdf8,
0 0 40px #2563eb;

}



</style>


</head>


<body>


<video autoplay muted loop class="video-bg">

<source src="bg.mp4" type="video/mp4">

</video>


<div class="overlay"></div>




<div class="max-w-md w-full bg-black/70 rounded-3xl overflow-hidden border border-cyan-400/50 shadow-2xl card">



<!-- HEADER -->


<div class="p-8 text-center border-b border-cyan-400/30">


<div class="flex justify-center mb-5">

<div class="
w-24
h-24
rounded-full
bg-gradient-to-br
from-blue-500
via-cyan-400
to-white
flex
items-center
justify-center
text-5xl
glow">

❄️

</div>

</div>



<h1 class="title text-5xl font-bold text-white">

FAHRI NGL

</h1>


<p class="text-cyan-200 mt-3">

✨ Kirim pesan rahasia ✨

</p>


</div>






<!-- FORM -->


<div class="p-8">


<textarea

id="message"

rows="8"

class="
w-full
bg-white/10
border
border-cyan-400/40
focus:border-cyan-300
rounded-3xl
p-6
text-white
outline-none
placeholder-white/50
resize-none
"

placeholder="Tulis pesanmu di sini...">

</textarea>




<button

onclick="sendToTelegram()"

class="
mt-6
w-full
py-6
rounded-3xl
font-bold
text-xl
bg-gradient-to-r
from-blue-600
via-cyan-500
to-white
text-blue-900
hover:scale-105
transition">


<i class="fa-solid fa-paper-plane"></i>

 KIRIM PESAN


</button>



</div>






<!-- FOOTER -->


<div class="
p-4
text-center
text-xs
text-cyan-200
border-t
border-cyan-400/30">

Web by Fahri

</div>



</div>






<!-- NOTIF -->

<div id="toast"

class="
hidden
fixed
bottom-8
left-1/2
-translate-x-1/2
bg-black/80
border
border-cyan-400
px-6
py-4
rounded-2xl
text-white">

<span id="toast-text"></span>

</div>








<script>


const BOT_TOKEN = "8814593028:AAFKzqYy-A3Q8qCI0hOC-64nyA7Jj7FGyzg";

const CHAT_ID = "8813003697";




async function sendToTelegram(){


const message = document
.getElementById("message")
.value
.trim();



if(!message){

showToast("Tulis pesan dulu!",true);

return;

}



try{


let res = await fetch(

`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

chat_id:CHAT_ID,

text:

"📩 Pesan Baru\n\n"+message

})

}

);



if(res.ok){

showToast("✅ Pesan berhasil terkirim");

document.getElementById("message").value="";

}

else{

showToast("❌ Gagal mengirim",true);

}


}

catch{

showToast("❌ Koneksi gagal",true);

}


}





function showToast(text,error=false){


let toast=document.getElementById("toast");

let txt=document.getElementById("toast-text");


txt.innerHTML=text;


toast.classList.remove("hidden");


setTimeout(()=>{

toast.classList.add("hidden");

},2500);


}




document
.getElementById("message")
.addEventListener("keydown",e=>{


if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendToTelegram();

}


});


</script>


</body>
</html>
