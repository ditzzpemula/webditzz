<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Biasa... atau?</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    #main-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    #scare-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      display: none;
      z-index: 999;
    }
    #scare-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 5rem;
      text-shadow: 0 0 30px red;
      display: none;
      z-index: 1000;
      animation: flash 0.2s infinite;
    }
    @keyframes flash {
      0% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Video Utama (video.mp4) -->
  <video id="main-video" autoplay controls>
    <source src="video.mp4" type="video/mp4">
    Browser tidak mendukung video.
  </video>

  <!-- Jump Scare -->
  <div id="scare-container">
    <video id="scare-video" autoplay loop muted>
      <source src="scare.mp4" type="video/mp4"> <!-- Ganti nama file jump scare di sini -->
    </video>
    <div class="overlay">AHHHH!!!</div>
  </div>

  <script>
    const mainVideo = document.getElementById('main-video');
    const scareContainer = document.getElementById('scare-container');
    const scareVideo = document.getElementById('scare-video');
    const overlay = document.querySelector('.overlay');

    function triggerJumpScare() {
      const randomTime = Math.random() * 18000 + 7000; // 7 - 25 detik

      setTimeout(() => {
        if (!mainVideo.paused) {
          mainVideo.pause();

          scareContainer.style.display = 'block';
          scareVideo.play();
          overlay.style.display = 'block';

          // Kembali otomatis setelah 3 detik
          setTimeout(() => {
            scareContainer.style.display = 'none';
            overlay.style.display = 'none';
            scareVideo.pause();
            mainVideo.play();
          }, 3000);
        }
      }, randomTime);
    }

    // Mulai
    mainVideo.addEventListener('play', triggerJumpScare);

    // Klik untuk trigger manual
    document.addEventListener('click', () => {
      if (scareContainer.style.display === 'none') triggerJumpScare();
    });
  </script>
</body>
</html>
