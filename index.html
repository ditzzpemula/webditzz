<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roblox Status Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0d12;color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(720px,100%)}.brand{font-weight:800;font-size:28px;margin-bottom:18px}.brand span{color:#00a2ff}.card{background:#141820;border:1px solid #252b36;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.search{display:flex;gap:10px}.search input{flex:1;background:#0d1016;color:#fff;border:1px solid #303744;border-radius:14px;padding:15px;font-size:16px;outline:none}.search input:focus{border-color:#00a2ff}.search button{border:0;border-radius:14px;background:#00a2ff;color:white;font-weight:800;padding:0 20px;cursor:pointer}.search button:disabled{opacity:.5}.result{margin-top:22px;display:none}.profile{display:flex;gap:18px;align-items:center}.avatar{width:96px;height:96px;border-radius:20px;background:#202631;object-fit:cover}.name{font-size:25px;font-weight:800}.username{color:#8993a4;margin-top:4px}.status{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:999px;background:#202631;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#777}.online .dot{background:#23d46a;box-shadow:0 0 12px #23d46a}.offline .dot{background:#ff4d67}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.box{background:#0d1016;border:1px solid #242b35;border-radius:14px;padding:13px}.label{font-size:12px;color:#7f8999}.value{margin-top:5px;font-weight:700}.error{margin-top:15px;color:#ff7185;background:#32151d;padding:12px;border-radius:12px;display:none}.loading{display:none;margin-top:18px;color:#9da7b7}.hint{color:#7f8999;font-size:13px;margin-top:15px;line-height:1.5}@media(max-width:520px){.search{flex-direction:column}.search button{height:48px}.info{grid-template-columns:1fr}.profile{align-items:flex-start}}
</style></head>
<body><main class="wrap"><div class="brand">Roblox <span>Status</span></div><section class="card"><div class="search"><input id="username" placeholder="Masukkan username Roblox..." autocomplete="off"><button id="check">Cek Status</button></div><div id="loading" class="loading">Memeriksa akun Roblox...</div><div id="error" class="error"></div><div id="result" class="result"><div class="profile"><img id="avatar" class="avatar" alt="Avatar"><div><div id="display" class="name">-</div><div id="uname" class="username">@-</div><div id="status" class="status"><i class="dot"></i><span>-</span></div></div></div><div class="info"><div class="box"><div class="label">User ID</div><div id="id" class="value">-</div></div><div class="box"><div class="label">Terakhir online</div><div id="last" class="value">-</div></div></div></div><div class="hint">Masukkan username Roblox yang ingin diperiksa. Status berasal dari layanan presence Roblox.</div></section></main>
<script>
const $=id=>document.getElementById(id); const btn=$('check'); const input=$('username');
async function check(){const username=input.value.trim(); if(!username)return; btn.disabled=true;$('loading').style.display='block';$('error').style.display='none';$('result').style.display='none';try{const r=await fetch('/api/status?username='+encodeURIComponent(username));const d=await r.json();if(!r.ok||!d.user)throw new Error(d.error||'User tidak ditemukan.');$('display').textContent=d.user.displayName||d.user.name;$('uname').textContent='@'+d.user.name;$('id').textContent=d.user.id;$('avatar').src=d.avatar||'';const online=d.presence?.userPresenceType===2;$('status').className='status '+(online?'online':'offline');$('status').querySelector('span').textContent=online?'ONLINE':'OFFLINE';$('last').textContent=d.presence?.lastLocation||'Tidak tersedia';$('result').style.display='block'}catch(e){$('error').textContent=e.message;$('error').style.display='block'}finally{$('loading').style.display='none';btn.disabled=false}}
btn.onclick=check;input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body></html>
