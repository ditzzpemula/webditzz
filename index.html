<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fahri NGL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">


<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins,sans-serif;

}



/* VIDEO */

video{

position:fixed;
inset:0;

width:100%;
height:100%;

object-fit:cover;

z-index:-5;

}



/* DARK FILTER */

.bg{

position:fixed;
inset:0;

background:
linear-gradient(
135deg,
rgba(0,45,120,.9),
rgba(0,0,0,.5)
);

z-index:-4;

}





/* AURORA */


.aurora{

position:fixed;

width:500px;
height:500px;

background:#38bdf8;

filter:blur(160px);

opacity:.4;

animation:
aurora 10s infinite alternate;

}



@keyframes aurora{

from{
transform:translate(-200px,-150px);
}

to{
transform:translate(200px,150px);
}

}






/* CARD */


.card{

width:95%;
max-width:430px;

background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.35);

backdrop-filter:
blur(25px);

box-shadow:
0 30px 80px rgba(0,0,0,.6);

animation:
enter 1s ease;

}



@keyframes enter{

from{

opacity:0;
transform:
translateY(50px)
scale(.8);

}

to{

opacity:1;
transform:
translateY(0)
scale(1);

}

}





/* LOGO */


.logo{

animation:

pulse 2s infinite;

}



@keyframes pulse{

50%{

box-shadow:

0 0 50px #38bdf8;

}

}







/* INPUT */


textarea{

transition:.3s;

}



textarea:focus{

box-shadow:
0 0 30px #38bdf8;

}






/* BUTTON */


.send{

position:relative;

overflow:hidden;

background:

rgba(56,189,248,.25);

border:

1px solid white;

backdrop-filter:blur(15px);

transition:.4s;

}



.send:hover{

transform:scale(1.05);

}



.energy{

position:absolute;

width:200%;
height:200%;

background:
rgba(255,255,255,.25);

border-radius:40%;

left:-50%;

top:100%;

animation:

energy 5s linear infinite;

}



@keyframes energy{


50%{

top:-40%;

}


100%{

top:100%;

}

}







/* STAR */


.star{

position:fixed;

width:5px;

height:5px;

background:white;

border-radius:50%;

animation:
star 8s linear infinite;

}



@keyframes star{

from{

transform:translateY(100vh);

opacity:0;

}


20%{

opacity:1;

}


to{

transform:translateY(-20vh);

opacity:0;

}

}






/* TOAST */


.toast{

transition:.4s;

}



</style>

</head>


<body>


<video autoplay muted loop>

<source src="bg.mp4">

</video>


<div class="bg"></div>

<div class="aurora"></div>



<div class="star" style="left:20%;animation-delay:1s"></div>
<div class="star" style="left:50%;animation-delay:3s"></div>
<div class="star" style="left:80%;animation-delay:5s"></div>






<div class="
card
rounded-[40px]
p-8
text-white">



<div class="text-center">


<div class="
logo
mx-auto
w-28
h-28
rounded-full
bg-gradient-to-br
from-blue-500
to-white
flex
items-center
justify-center
text-6xl">

❄️

</div>



<h1 class="
text-5xl
font-extrabold
mt-6
bg-gradient-to-r
from-white
to-cyan-300
text-transparent
bg-clip-text">

Fahri NGL

</h1>


<p class="text-cyan-100">

Kirim pesan rahasia

</p>


</div>





<textarea

id="message"

rows="7"

class="
mt-8
w-full
rounded-3xl
bg-black/30
border
border-white/30
p-6
outline-none
text-white
"

placeholder="Tulis pesan kamu...">

</textarea>






<button

onclick="sendToTelegram()"

class="
send
mt-6
w-full
py-6
rounded-3xl
font-bold
text-xl">


<span class="relative z-10">

<i class="fa-solid fa-paper-plane"></i>

 KIRIM

</span>


<div class="energy"></div>


</button>





<p class="
text-center
text-xs
mt-6
text-cyan-100">

Web by Fahri

</p>


</div>






<div id="toast"

class="
toast
fixed
bottom-8
hidden
left-1/2
-translate-x-1/2
bg-black/80
border
border-cyan-400
px-6
py-4
rounded-2xl
text-white">

</div>







<script>


const BOT_TOKEN="8814593028:AAFKzqYy-A3Q8qCI0hOC-64nyA7Jj7FGyzg";

const CHAT_ID="8813003697";




async function sendToTelegram(){


let btn=document.querySelector(".send");

let msg=document
.getElementById("message")
.value.trim();



if(!msg){

show("Tulis pesan dulu");

return;

}



btn.innerHTML="⏳ Mengirim...";



try{


let res=await fetch(

`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

chat_id:CHAT_ID,

text:
"📩 Pesan Baru\n\n"+msg

})

}

);



if(res.ok){

show("✅ Pesan terkirim");

document.getElementById("message").value="";

}else{

show("❌ Gagal kirim");

}


}

catch{

show("❌ Error koneksi");

}



btn.innerHTML=
`
<span class="relative z-10">
<i class="fa-solid fa-paper-plane"></i>
 KIRIM
</span>
<div class="energy"></div>
`;


}





function show(text){

let t=document.getElementById("toast");

t.innerHTML=text;

t.classList.remove("hidden");


setTimeout(()=>{

t.classList.add("hidden");

},2500);


}



</script>


</body>
</html>
