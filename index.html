<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fahri NGL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Poppins,sans-serif;

}


/* VIDEO */

.video-bg{

position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;

}



.overlay{

position:fixed;
inset:0;

background:
linear-gradient(
135deg,
rgba(0,55,150,.85),
rgba(255,255,255,.2)
);

z-index:-2;

}




/* LIGHT EFFECT */

.light{

position:fixed;
width:400px;
height:400px;
background:#38bdf8;
filter:blur(150px);
opacity:.4;
animation:move 8s infinite alternate;

}



@keyframes move{

from{
transform:translate(-100px,-100px);
}

to{
transform:translate(150px,120px);
}

}





/* CARD */


.card{

width:100%;
max-width:430px;

background:
rgba(255,255,255,.12);

border:
1px solid
rgba(255,255,255,.35);

backdrop-filter:
blur(20px);

box-shadow:
0 25px 70px rgba(0,0,0,.5);

animation:
show .8s ease;

}




@keyframes show{

from{

opacity:0;
transform:translateY(50px) scale(.9);

}

to{

opacity:1;
transform:translateY(0) scale(1);

}

}





/* LOGO */


.logo{

animation:
rotate 6s linear infinite;

}



@keyframes rotate{

100%{

transform:rotate(360deg);

}

}




.gradient-text{

background:
linear-gradient(
90deg,
#fff,
#38bdf8
);

-webkit-background-clip:text;
color:transparent;

}






/* INPUT */


textarea{

transition:.3s;

}



textarea:focus{

box-shadow:
0 0 25px #38bdf8;

}







/* BUTTON */


.send{

position:relative;
overflow:hidden;

background:
rgba(56,189,248,.25);

border:
1px solid
rgba(255,255,255,.5);

backdrop-filter:blur(15px);

}



.send:hover{

transform:scale(1.05);

box-shadow:
0 0 30px #38bdf8;

}



.wave{

position:absolute;

width:250%;
height:250%;

background:
rgba(255,255,255,.3);

border-radius:45%;

left:-75%;
top:100%;

animation:
wave 5s linear infinite;

}



@keyframes wave{

0%{
top:100%;
transform:rotate(0);
}

50%{
top:-50%;
}

100%{
top:100%;
transform:rotate(360deg);
}

}





.shine{

position:absolute;
top:0;
left:-100%;

width:50%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.5),
transparent
);

animation:
shine 3s infinite;

}



@keyframes shine{

to{

left:150%;

}

}





/* PARTICLE */


.dot{

position:fixed;

width:8px;
height:8px;

background:white;

border-radius:50%;

opacity:.5;

animation:
float 8s infinite;

}



@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-20vh);

}

}



</style>


</head>


<body>


<div class="light"></div>


<div class="dot" style="left:20%;animation-delay:1s"></div>
<div class="dot" style="left:70%;animation-delay:3s"></div>
<div class="dot" style="left:40%;animation-delay:5s"></div>



<video autoplay muted loop class="video-bg">

<source src="bg.mp4">

</video>



<div class="overlay"></div>





<div class="card rounded-[35px] p-8 text-white">



<div class="text-center">


<div class="
logo
mx-auto
w-24
h-24
rounded-full
bg-gradient-to-br
from-blue-500
to-white
flex
items-center
justify-center
text-5xl
shadow-xl">

❄️

</div>



<h1 class="
gradient-text
text-5xl
font-bold
mt-5">

Fahri NGL

</h1>


<p class="text-cyan-100 mt-2">

Kirim pesan rahasia

</p>


</div>





<textarea

id="message"

rows="7"

class="
mt-8
w-full
rounded-3xl
bg-black/30
border
border-white/30
p-6
text-white
outline-none
placeholder-white/50
"

placeholder="Tulis pesan kamu...">

</textarea>






<button

onclick="sendToTelegram()"

class="
send
mt-6
w-full
py-6
rounded-3xl
font-bold
text-xl
">


<span class="relative z-10">

<i class="fa-solid fa-paper-plane"></i>

 KIRIM PESAN

</span>


<div class="wave"></div>

<div class="shine"></div>


</button>





<p class="
text-center
text-xs
text-cyan-100
mt-6">

Web by Fahri

</p>



</div>









<script>


const BOT_TOKEN="8814593028:AAFKzqYy-A3Q8qCI0hOC-64nyA7Jj7FGyzg";

const CHAT_ID="8813003697";





async function sendToTelegram(){


let msg=document
.getElementById("message")
.value.trim();



if(!msg){

alert("Tulis pesan dulu!");

return;

}



await fetch(

`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

chat_id:CHAT_ID,

text:
"📩 Pesan Baru\n\n"+msg

})

}

);



alert("✅ Pesan berhasil terkirim");


document.getElementById("message").value="";


}



</script>


</body>
</html>
