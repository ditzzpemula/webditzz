<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAHRI GABUT</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

/* Video Background */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Overlay Biru */
.overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(rgba(0,180,255,.35),rgba(0,50,120,.65));
    backdrop-filter:blur(4px);
    z-index:-1;
}

/* Card */
.card{
    width:350px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:2px solid rgba(255,255,255,.3);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 35px #00BFFF;
    animation:fade 1s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Avatar */
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #00BFFF;
    box-shadow:0 0 25px #00BFFF;
}

h2{
    margin-top:15px;
    color:#fff;
    font-size:28px;
    text-shadow:0 0 15px #00BFFF;
}

.bio{
    color:#eaf8ff;
    margin:10px 0 25px;
}

/* Tombol */
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(90deg,#00BFFF,#0099FF);
    padding:15px;
    margin:12px 0;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00BFFF;
}

.footer{
    margin-top:25px;
    color:#fff;
    font-size:13px;
}

.credit{
    display:block;
    margin-top:8px;
    font-size:14px;
    color:#fff;
    font-weight:bold;
    text-shadow:0 0 12px #00BFFF;
}

.anime{
    margin-top:15px;
    color:#fff;
    text-shadow:0 0 10px #00BFFF;
}
</style>

</head>
<body>

<!-- Background Video -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="card">

<img src="profil.jpg" class="avatar" alt="Foto Profil">

<h2>FAHRI GABUT</h2>

<p class="bio">
Creator • Gaming • Developer
</p>

<a class="btn" href="https://www.tiktok.com/@username" target="_blank">
<i class="fa-brands fa-tiktok"></i>
TikTok
</a>

<a class="btn" href="https://instagram.com/username" target="_blank">
<i class="fa-brands fa-instagram"></i>
Instagram
</a>

<a class="btn" href="https://whatsapp.com/channel/xxxxxxxx" target="_blank">
<i class="fa-brands fa-whatsapp"></i>
Saluran WhatsApp
</a>

<div class="anime">
✨ Blue Anime Theme ✨
</div>

<div class="footer">
© 2026 FAHRI GABUT
<span class="credit">Website by &lt;/&gt; Fahri</span>
</div>

</div>

</body>
</html>
